<div class="center-body">
    <!-- Contenedor principal del formulario de registro -->
    <div class="register-container">
        
        <!-- Título de la plataforma -->
        <div class="title">Zengaku</div>
        
        <!-- Subtítulo con información sobre el propósito de la página -->
        <div class="subtitle">Crea tu cuenta</div>
        
        <!-- Formulario de registro -->
        <form>
            <!-- Campo para ingresar el nombre -->
            <input type="text" placeholder="Nombres" required autocomplete="Nombre">
            
            <!-- Campo para ingresar el apellido -->
            <input type="text" placeholder="Apellidos" required autocomplete="Apellido">

            <!-- Campo para ingresar el nombre de usuario -->
            <input type="text" placeholder="Usuario" required autocomplete="username">
            
            <!-- Campo para ingresar el correo electrónico -->
            <input type="email" placeholder="Correo electrónico" required autocomplete="email">
            
            <!-- Campo para ingresar la contraseña -->
            <input type="password" placeholder="Contraseña" required autocomplete="new-password">
            
            <!-- Botón para enviar el formulario y completar el registro -->
            <button type="submit">Registrarse</button>
        </form>

        <!-- Pie de página con opción para iniciar sesión si el usuario ya tiene cuenta -->
        <div class="footer-register">
            ¿Ya tienes cuenta? 
            <a class="switch-link" href="/Auth/Login/Login.html">Inicia sesión</a>
        </div>
    </div>
</div>

<div class ="center-body">
    <!-- Contenedor principal del formulario de inicio de sesión -->
    <div class="login-container">
        
        <!-- Logo de la plataforma -->
        <div class="logo">
            <img src="../../../assets/images/Logo.png" alt="Logo de Zengaku">
        </div>

        <!-- Título de la plataforma -->
        <div class="title">Zengaku</div>

        <!-- Subtítulo con información sobre el propósito de la página -->
        <div class="subtitle">Inicia sesión para continuar</div>

        <!-- Formulario de inicio de sesión -->
        <form>
            <!-- Campo para ingresar el nombre de usuario -->
            <input type="text" placeholder="Usuario" required autocomplete="username">

            <!-- Campo para ingresar la contraseña -->
            <input type="password" placeholder="Contraseña" required autocomplete="current-password">

            <!-- Enlace para recuperar la contraseña en caso de olvidarla -->
            <div class="forgot-link">
                <a class="switch-link" (click)="goToForgotPassword()">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón para enviar el formulario e iniciar sesión -->
            <button type="submit">Ingresar</button>
        </form>

        <!-- Pie de página con opción para registrarse si el usuario no tiene cuenta -->
        <div class="footer">
            ¿No tienes cuenta?
            <a class="switch-link" href="/Auth/Register/Register.html">Regístrate</a>
        </div>
    </div>

</div>
